<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Çevrimdışı · PeakNET</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0b;
        color: #e7e7ea;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 380px;
        text-align: center;
      }
      .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 28px; }
      .logo span { color: #6366f1; }
      .icon {
        width: 64px; height: 64px; margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 18px; background: rgba(99,102,241,0.12);
      }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; color: #9b9ba3; margin: 0 0 24px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #6366f1; color: #fff; font-weight: 600; font-size: 14px;
        padding: 11px 22px; border-radius: 10px; transition: opacity .15s;
      }
      button:hover { opacity: .9; }
      .hint { margin-top: 18px; font-size: 12px; color: #6b6b73; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">Peak<span>NET</span></div>
      <div class="icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>Çevrimdışısın</h1>
      <p>İnternet bağlantın yok. Daha önce açtığın sayfalar çevrimdışı çalışır; AI ve canlı veriler için bağlantı gerekir.</p>
      <button onclick="location.reload()">Tekrar dene</button>
      <div class="hint">Bağlantı gelince otomatik yenilenir.</div>
    </div>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
